name: "Sync from upstream"

on:
  schedule: [{ cron: "17 7 * * *" }]
  workflow_dispatch:
    inputs:
      tag: { description: "Upstream release tag to merge (blank = newest release)", required: false, type: "string" }
      force: { description: "Publish over an existing release for the same base", required: false, type: "boolean", default: false }

permissions: { contents: "write", issues: "write" }
concurrency: { group: "upstream-sync", cancel-in-progress: false }

jobs:
  sync:
    uses: "DecibillyJoel/fork-ops/.github/workflows/sync-release.yml@v1"
    with:
      tag: ${{ inputs.tag || '' }}
      force: ${{ inputs.force || false }}
    secrets: inherit
